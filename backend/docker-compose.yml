services:
  db:
    image: mariadb:11.4
    container_name: duet_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: duet
      MARIADB_USER: duet
      MARIADB_PASSWORD: duet
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - duet_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: duet_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - duet_redis_data:/data

volumes:
  duet_db_data:
  duet_redis_data: