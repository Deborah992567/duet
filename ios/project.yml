name: EnvyChat
options:
  bundleIdPrefix: com.envychat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
targets:
  EnvyChat:
    type: application
    platform: iOS
    info:
      path: EnvyChat/Info.plist
      properties:
        CFBundleDisplayName: EnvyChat
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSApplicationQueriesSchemes: []
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    sources:
      - path: EnvyChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.envychat.app
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies: []
  EnvyChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EnvyChatTests
    dependencies:
      - target: EnvyChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.envychat.tests
schemes:
  EnvyChat:
    build:
      targets:
        EnvyChat: all
        EnvyChatTests: [test]
    test:
      targets:
        - EnvyChatTests
    run:
      config: Debug
    archive:
      config: Release