name: Duet
options:
  bundleIdPrefix: com.duet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
targets:
  Duet:
    type: application
    platform: iOS
    info:
      path: Duet/Info.plist
      properties:
        CFBundleDisplayName: Duet
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSApplicationQueriesSchemes: []
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: com.duet.app
            CFBundleURLSchemes:
              - duet
    sources:
      - path: Duet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duet.app
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies: []
  DuetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DuetTests
    dependencies:
      - target: Duet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duet.tests
schemes:
  Duet:
    build:
      targets:
        Duet: all
        DuetTests: [test]
    test:
      targets:
        - DuetTests
    run:
      config: Debug
    archive:
      config: Release